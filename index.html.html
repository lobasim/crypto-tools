<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Шифрование текста</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f4f5f7;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
        padding: 40px 16px;
    }

    .card {
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
        padding: 32px;
        width: 640px;
        max-width: 100%;
    }

    h1 { font-size: 22px; margin-bottom: 20px; text-align: center; }

    .pass-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 16px;
    }

    .pass-row label { font-weight: 600; white-space: nowrap; }

    .pass-wrapper {
        flex: 1;
        display: flex;
        position: relative;
    }

    input[type="password"], input[type="text"]#password {
        flex: 1;
        padding: 10px 44px 10px 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 15px;
    }

    .eye-btn {
        position: absolute;
        right: 6px;
        top: 50%;
        transform: translateY(-50%);
        border: none;
        background: none;
        cursor: pointer;
        font-size: 18px;
        padding: 4px 8px;
        border-radius: 6px;
        line-height: 1;
    }

    .eye-btn:hover { background: #eef0f4; }

    textarea {
        width: 100%;
        min-height: 180px;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 15px;
        resize: vertical;
        font-family: inherit;
    }

    .btn-row { display: flex; gap: 10px; margin: 16px 0 10px; }

    button {
        flex: 1;
        padding: 12px 20px;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
    }

    #encrypt { background: #4a76ff; color: #fff; }
    #encrypt:hover { background: #3a5fe0; }

    #decrypt { background: #eef0f4; color: #333; }
    #decrypt:hover { background: #e0e3ea; }

    .status { min-height: 20px; font-size: 14px; margin-bottom: 4px; }
    .status.ok { color: #27ae60; }
    .status.err { color: #c0392b; }

    .hint { font-size: 13px; color: #888; line-height: 1.5; }
</style>
</head>
<body>
<div class="card">
    <h1>Шифрование текста</h1>

    <div class="pass-row">
        <label for="password">Пароль:</label>
        <div class="pass-wrapper">
            <input type="password" id="password" autocomplete="off">
            <button type="button" class="eye-btn" id="togglePass"
                    title="Показать пароль" aria-label="Показать пароль">👁</button>
        </div>
    </div>

    <textarea id="text" placeholder="Введите текст и нажмите «Зашифровать» — или вставьте шифровку и нажмите «Расшифровать»"></textarea>

    <div class="btn-row">
        <button id="encrypt">Зашифровать</button>
        <button id="decrypt">Расшифровать</button>
    </div>

    <div class="status" id="status"></div>

    <p class="hint">Пароль нигде не сохраняется и не передаётся — он используется только для вывода ключа шифрования.
    Забытый пароль восстановить невозможно.</p>
</div>

<script>
    const MAGIC = "PWF1";        // метка формата
    const SALT_SIZE = 16;        // байты соли
    const IV_SIZE = 12;          // байты IV для AES-GCM
    const ITERATIONS = 600_000;  // итерации PBKDF2

    const enc = new TextEncoder();
    const dec = new TextDecoder();

    // ---------- Показать/скрыть пароль ----------
    const passInput = document.getElementById("password");
    const toggleBtn = document.getElementById("togglePass");

    toggleBtn.addEventListener("click", () => {
        const hidden = passInput.type === "password";
        passInput.type = hidden ? "text" : "password";
        toggleBtn.textContent = hidden ? "🙈" : "👁";
        toggleBtn.title = hidden ? "Скрыть пароль" : "Показать пароль";
        toggleBtn.setAttribute("aria-label", toggleBtn.title);
    });

    // ---------- Base64 helpers ----------
    function toBase64(bytes) {
        let bin = "";
        bytes.forEach(b => bin += String.fromCharCode(b));
        return btoa(bin);
    }

    function fromBase64(str) {
        const bin = atob(str);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes;
    }

    function concat(...arrays) {
        const total = arrays.reduce((s, a) => s + a.length, 0);
        const out = new Uint8Array(total);
        let offset = 0;
        for (const a of arrays) { out.set(a, offset); offset += a.length; }
        return out;
    }

    // ---------- Шифрование ----------
    async function deriveKey(password, salt) {
        const keyMaterial = await crypto.subtle.importKey(
            "raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);

        return crypto.subtle.deriveKey(
            { name: "PBKDF2", salt, iterations: ITERATIONS, hash: "SHA-256" },
            keyMaterial,
            { name: "AES-GCM", length: 256 },
            false,
            ["encrypt", "decrypt"]);
    }

    async function encryptText(text, password) {
        const salt = crypto.getRandomValues(new Uint8Array(SALT_SIZE));
        const iv = crypto.getRandomValues(new Uint8Array(IV_SIZE));
        const key = await deriveKey(password, salt);

        const cipher = new Uint8Array(await crypto.subtle.encrypt(
            { name: "AES-GCM", iv }, key, enc.encode(text)));

        const magic = enc.encode(MAGIC);
        return toBase64(concat(magic, salt, iv, cipher));
    }

    async function decryptText(data, password) {
        const raw = fromBase64(data.trim());
        const magic = enc.encode(MAGIC);

        if (raw.length < magic.length + SALT_SIZE + IV_SIZE + 16 ||
            !magic.every((b, i) => raw[i] === b)) {
            throw new Error("FORMAT");
        }

        const salt = raw.slice(magic.length, magic.length + SALT_SIZE);
        const iv = raw.slice(magic.length + SALT_SIZE, magic.length + SALT_SIZE + IV_SIZE);
        const cipher = raw.slice(magic.length + SALT_SIZE + IV_SIZE);

        const key = await deriveKey(password, salt);

        try {
            const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, cipher);
            return dec.decode(plain);
        } catch {
            throw new Error("WRONG_PASSWORD");
        }
    }

    // ---------- Интерфейс ----------
    const textEl = document.getElementById("text");
    const statusEl = document.getElementById("status");

    function showStatus(message, error) {
        statusEl.textContent = message;
        statusEl.className = error ? "status err" : "status ok";
    }

    document.getElementById("encrypt").addEventListener("click", async () => {
        const text = textEl.value;
        const password = passInput.value;
        if (!text) { showStatus("Введите текст для шифрования.", true); return; }
        if (!password) { showStatus("Введите пароль.", true); return; }
        try {
            textEl.value = await encryptText(text, password);
            showStatus("Текст зашифрован. Не потеряйте пароль — восстановить его невозможно.");
        } catch (e) {
            showStatus("Ошибка шифрования: " + e.message, true);
        }
    });

    document.getElementById("decrypt").addEventListener("click", async () => {
        const data = textEl.value;
        const password = passInput.value;
        if (!data) { showStatus("Вставьте зашифрованный текст.", true); return; }
        if (!password) { showStatus("Введите пароль.", true); return; }
        try {
            textEl.value = await decryptText(data, password);
            showStatus("Текст успешно расшифрован.");
        } catch (e) {
            if (e.message === "FORMAT") {
                showStatus("Это не похоже на текст, зашифрованный этой программой.", true);
            } else if (e.message === "WRONG_PASSWORD") {
                showStatus("Неверный пароль или текст повреждён.", true);
            } else {
                showStatus("Не удалось расшифровать: проверьте, что Base64 скопирован целиком.", true);
            }
        }
    });
</script>
</body>
</html>
